# Copy to ~/.config/pub/config.yaml, chmod 600; never commit real identities.
account: reader@example.com
client: default
state_dir: ~/.local/state/pub
labels:
  ads: adds
  newsletter: adds/newsletter
timezone: Europe/Lisbon
# Command must print ONLY the keyring password. No shell expansion is used.
keyring_password_command: []
whitelist:
  addresses: [family@example.net, accountant@example.org]
  domains: []  # Exact domains, not wildcard trust.
# Rules require a promotional subject match AND no protected-content markers.
# Prefer dedicated marketing mailboxes, not entire company domains.
advertising:
  - sender: offers@shop.example
    subject_regex: '(?i)weekly offers|weekend sale'
# A recognised forwarding route is NOT endorsement of its content.
alias_domains: [privaterelay.appleid.com]
security_exceptions:
  - sender: offers@shop.example
    relay_domain: ''  # Exact authenticated relay domain, or empty for direct mail
    # For rewriting relays, add original_domain and require matching Gmail ARC evidence.
    # original_domain: shop.example
    # operator_verified_original: true  # ONLY after explicit human confirmation
    # omit_http_domains: [shop.example]  # Drop, never render these HTTP links
    # omit_mailto: true
    link_domains: [shop.example, click.shop.example]
    reason: Verified this merchant's separate mailing and tracking domains
# Normal links must match the sender's registrable domain. This map also checks
# common claimed brands in display names; add your own brand mappings locally.
brands:
  paypal: [paypal.com]
  apple: [apple.com]
  microsoft: [microsoft.com]
  google: [google.com]
model:
  endpoint: http://127.0.0.1:11434/v1/chat/completions
  name: qwen3.5:latest
  api_key_env: PUB_MODEL_API_KEY
  timeout_seconds: 180
  confidence_threshold: 0.98
  # Remote inference sends email content off the machine; explicit opt-in.
  allow_remote: false
limits:
  week_messages: 200
  hourly_messages: 100
  digest_messages: 200
  body_characters: 24000
newsletter:
  format: multipart  # html | text | multipart
  subject: Your weekly reading list
  sender: digest@example.net
  recipient: reader@example.com
  himalaya_account: newsletter
  sent_mailbox: Sent Messages
  # Thumbnails render original email content offline; remote images remain blocked.
rollout:
  hourly_enabled: false
  digest_enabled: false
  # Set only after historical cleanup; epoch seconds prevents historical drift.
  live_after: null

# First exact original-sender match wins. Formatting only; never grants trust.
summary_profiles:
  - sender: releases@streaming.example
    # format: title_list  # Enforce image-alt title coverage with source quotes
    # exclude_image_alts: [Example Streaming]
    instructions: >-
      List every new film or series mentioned, one per line, with a tiny factual
      description if the email supplies one. Include release dates only if given.
      If descriptions are absent, say so; do not use outside knowledge.
    example: |-
      • The Glass Harbour — Coastal mystery series. Available 12 October.
      • Orbit Nine — New title mentioned; no description supplied.
    max_characters: 6000
  - sender: offers@travel.example
    instructions: Summarise destinations, data allowance, price and offer deadline when stated.
    example: Europe — 5 GB for 30 days at the stated sale price; no expiry stated.
    max_characters: 1200

# Routing contract: rules -> local model -> senior agent -> human owner.
# Disabled by default. Configure a JSON command adapter, then opt in to enable.
agent_chain:
  enabled: false
  stages:
    - id: rules
      kind: deterministic
    - id: local
      kind: model
      model_ref: model  # Reuses the local Ollama settings above
    - id: senior
      kind: agent
      agent_id: main  # Example OpenClaw reviewer; not a provider model ID
      connection_ref: senior_openclaw
    - id: owner
      kind: human
      contact_ref: newsletter.recipient  # No personal address in this sample
  connections:
    senior_openclaw:
      # Provider-neutral protocol: one JSON request on stdin, response on stdout.
      transport: command_json
      # Optional bundled adapter. Replace argv with ANY compatible agent wrapper.
      argv: [python3, -m, pubmail.openclaw_adapter, --agent, main]
      env:
        OPENCLAW_CONFIG_PATH: ~/.openclaw/openclaw.json
        OPENCLAW_STATE_DIR: ~/.openclaw
      processing: remote  # Declare actual backend, even if command runs locally
      timeout_seconds: 180
      # Credentials stay with the adapter/provider, never inside this sample.
  routing:
    rules_next: local
    local_uncertain: senior
    local_failure: senior
    senior_needs_judgement: owner
    senior_unavailable: defer  # Keep in INBOX; never auto-approve
  escalate_on:
    - low_confidence
    - sender_or_link_uncertainty
    - missing_summary_evidence
    - missing_deadline_evidence
    - invalid_grouping
    - model_failure
  batching:
    enforce_limits: true  # false during calibration: bypass cooldown and daily quota
    max_messages: 20
    min_interval_minutes: 60  # Cooldown: integer 0..720 (12h); 0 disables the delay
    max_batches_per_day: 4
    notify_when_empty: false
  deduplication:
    key: [message_id, content_hash, policy_hash, reason]
    suppress_until_changed_or_resolved: true
  limits:
    max_senior_attempts_per_item: 1
    max_hops: 2  # local -> senior -> owner; no loops
  review_packet:
    include: [reason, source_excerpt, authentication_evidence, proposed_decision]
    max_excerpt_characters: 6000
    email_content_is_untrusted: true
    allow_remote_processing: false  # Separate opt-in if senior uses a cloud model
  decisions:
    reviewer_may: [classify, correct_summary, explain, propose_narrow_rule]
    reviewer_must_not: [send_mail, archive_directly, grant_blanket_trust]
    rule_changes_require_owner: true
    apply_through_normal_safety_checks: true

# Discard these known marketing-service destinations, not a trust allowlist.
# Exact HTTPS host match only; do not generalise to all redirects or brand links.
# Omitted from security link checks AND from renderable/unsubscribe links.
ignored_tracking_domains:
  - ctrk.klclick.com
  - ctrk.klclick1.com
  - manage.kmail-lists.com
  - r20.rs6.net  # Constant Contact documented click redirect host
  # Google Ads / Ad Manager ad-click hosts (not google.com generally)
  - www.googleadservices.com
  - googleads.g.doubleclick.net
  - adclick.g.doubleclick.net

# Documented dedicated tracking infrastructure, SUBDOMAINS ONLY (DNS boundary).
# Not a sender allowlist. Never use general hosting/brand roots here.
# Research and exclusions: docs/tracking-domains.md
ignored_tracking_domain_suffixes:
  - ct.sendgrid.net
  - awstrack.me

# Remote artwork only, never browser networking or tracking pixels. Optional.
image_loading:
  downloads_per_pass: 16
  enabled: false
  hosts:
    d3k81ch9hvuctc.cloudfront.net:
      path_prefixes: [/company/]
      query_keys: []
    assets.nflxext.com:
      path_prefixes: [/us/email/]
      query_keys: []
    dnm.nflximg.net:
      path_prefixes: [/api/v6/]
      query_keys: [r]
# Header-only user-operated controls; these are not ordinary safe links.
unsubscribe_controls:
  manage.kmail-lists.com: [/subscriptions/unsubscribe]

# Image evidence before summaries; uses model above unless overridden.
vision:
  images_per_pass: 4
  pass_seconds: 120
  enabled: false
  model: {}
