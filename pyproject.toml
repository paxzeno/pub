[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmail"
version = "0.1.0"
description = "Conservative Gmail promotion triage and a private weekly digest"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0,<7", "Jinja2>=3.1.6,<4", "publicsuffix2>=2.20191221", "playwright>=1.50,<2", "Pillow>=11,<13"]

[project.scripts]
pubmail = "pubmail.cli:main"

[tool.setuptools.package-data]
pubmail = ["templates/*.html"]

[tool.setuptools.packages.find]
include = ["pubmail*"]
